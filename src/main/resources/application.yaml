app:
  base-url: http://localhost:8080

spring:
  application:
    name: url-shortener

  liquibase:
    change-log: classpath:/db/changelog-master.yaml

management:
  endpoints:
    web:
      # Only /actuator/health is exposed over HTTP (Spring Boot's default). The discovery page
      # at /actuator is turned off: it is a single path segment, so it would take that path away
      # from the redirect route "/{alias}" (D5).
      discovery:
        enabled: false

logging:
  structured:
    format:
      # JSON on the console, in the Elastic Common Schema (ECS) format (D17). The service name in
      # each line comes from spring.application.name above. The local profile switches this off.
      console: ecs
